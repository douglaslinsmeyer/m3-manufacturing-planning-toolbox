apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: lp-manufacturing-planning-toolbox
  labels:
    app_name: "manufacturing-planning-toolbox"
    group: "ERP-MIS"
    app.kubernetes.io/managed-by: ping-launchpad
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: "4Gi"
    limits.memory: "8Gi"
    count/pods: "20"
    count/services: "5"
    count/persistentvolumeclaims: "3"
    count/secrets: "20"
    count/configmaps: "20"
