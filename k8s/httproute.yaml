apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lp-production-planning-issues-workbench
  namespace: lp-production-planning-issues-workbench
  labels:
    launchpad.ping.com/app: "lp-production-planning-issues-workbench"
    app.kubernetes.io/part-of: "lp-production-planning-issues-workbench"
    group: "ERP-MIS"
    app_name: "production-planning-issues-workbench"
    contact_person: "douglasl_at_ping_com"
spec:
  parentRefs:
  - name: sii-gateway
    namespace: nginx-gateway
  hostnames:
  - "lp-production-planning-issues-workbench.sii.ping.com"
  rules:
  # API traffic (REST + SSE progress streams) -> Go backend
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend
      port: 8080
  # Everything else -> React frontend (nginx)
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 80
