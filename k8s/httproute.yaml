apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lp-manufacturing-planning-toolbox
  namespace: lp-manufacturing-planning-toolbox
  labels:
    launchpad.ping.com/app: "lp-manufacturing-planning-toolbox"
    app.kubernetes.io/part-of: "lp-manufacturing-planning-toolbox"
    group: "ERP-MIS"
    app_name: "manufacturing-planning-toolbox"
    contact_person: "douglasl_at_ping_com"
spec:
  parentRefs:
  - name: sii-gateway
    namespace: nginx-gateway
  hostnames:
  - "lp-manufacturing-planning-toolbox.sii.ping.com"
  rules:
  # API traffic (REST + SSE progress streams) -> Go backend
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: backend
      port: 8080
  # Everything else -> React frontend (nginx)
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: frontend
      port: 80
