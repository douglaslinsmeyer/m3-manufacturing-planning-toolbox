apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
  namespace: lp-production-planning-issues-workbench
  labels:
    group: "ERP-MIS"
    app_name: "production-planning-issues-workbench"
    contact_person: "douglasl_at_ping_com"
spec:
  # Workers share the backend image/binary; they coordinate snapshot
  # refresh jobs via NATS queue groups (see CLAUDE.md architecture notes).
  replicas: 3
  selector:
    matchLabels:
      app: backend-worker
  template:
    metadata:
      labels:
        app: backend-worker
        group: "ERP-MIS"
        app_name: "production-planning-issues-workbench"
        contact_person: "douglasl_at_ping_com"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend-worker
        image: pingsiiplatformacr.azurecr.io/lp-production-planning-issues-workbench/backend:__GIT_SHA__
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_PORT
          value: "8080"
        - name: FRONTEND_URL
          value: "https://lp-production-planning-issues-workbench.sii.ping.com"
        - name: OAUTH_REDIRECT_URI
          value: "https://lp-production-planning-issues-workbench.sii.ping.com/api/auth/callback"
        - name: CORS_ALLOWED_ORIGINS
          value: "https://lp-production-planning-issues-workbench.sii.ping.com"
        - name: CORS_ALLOW_CREDENTIALS
          value: "true"
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: RUN_MIGRATIONS
          value: "false"
        - name: LOG_LEVEL
          value: "info"
        - name: LOG_FORMAT
          value: "json"
        # Single M3 environment per deployment — change these five values
        # (and the M3_IONAPI secret) to retarget the app at another tenant.
        - name: M3_ENVIRONMENT
          value: "PRD"
        - name: M3_TENANT_ID
          value: "XK3JRT8CJCAF9GWY_PRD"
        - name: M3_INSTANCE_ID
          value: "20233849-6dca-4bd1-bf9f-13972ace238f"
        - name: M3_API_BASE_URL
          value: "https://mingle-ionapi.inforcloudsuite.com/XK3JRT8CJCAF9GWY_PRD/"
        - name: M3_COMPASS_BASE_URL
          value: "https://mingle-ionapi.inforcloudsuite.com/XK3JRT8CJCAF9GWY_PRD/DATAFABRIC/compass/v2/"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: DATABASE_URL
        envFrom:
        - secretRef:
            name: app-secrets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
      volumes:
      - name: tmp
        emptyDir: {}
